name: Set app icon

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  icon:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare icon files
        run: |
          echo "download start"
          curl -fsSL "https://aka.doubaocdn.com/s/nsTsAcrZXs" -o icon-src.png
          ls -la icon-src.png
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import os
          from PIL import Image, ImageOps
          src = Image.open('icon-src.png').convert('RGBA')
          print('source size', src.size)
          side = min(src.size)
          src = ImageOps.fit(src, (side, side), method=Image.LANCZOS, centering=(0.5, 0.5))
          for size, name in [(180, 'apple-touch-icon.png'), (192, 'icon-192.png'), (512, 'icon-512.png')]:
              src.resize((size, size), Image.LANCZOS).save(name)
          print('icons done', sorted(os.listdir('.')))
          PY

      - name: Commit icons
        run: |
          git config user.name "icon-bot"
          git config user.email "icon-bot@users.noreply.github.com"
          rm -f icon-src.png
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "switch app icon to zhezhe cat [skip ci]"
          git push
